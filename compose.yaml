services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: papbox
      POSTGRES_USER: papbox_migrator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PAPBOX_DB_PASSWORD: ${PAPBOX_DB_PASSWORD:?Set PAPBOX_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - papbox_postgres:/var/lib/postgresql/data
      - ./config/postgres/init-app.sh:/docker-entrypoint-initdb.d/010-app.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U papbox_migrator -d papbox"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  papbox_postgres:
